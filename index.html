<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KolibriOS - Máy ảo trên Web</title>

    <!-- BƯỚC 1: Chặn vòng lặp reload của coi-serviceworker (PHẢI đặt trước) -->
    <script>
      window.coi = {
        shouldRegister: () => !window.sessionStorage.getItem("coiReloadedBySelf"),
        shouldDeregister: () => false,
      };
    </script>

    <!-- BƯỚC 2: Service worker tạo COOP/COEP headers để có SharedArrayBuffer -->
    <script src="coi-serviceworker.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            background: #1a1a1a;
            color: #eee;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #4ec9b0; margin: 10px 0; font-size: 18px; }
        #screen_container {
            background: #000;
            border: 2px solid #4ec9b0;
            border-radius: 6px;
            padding: 10px;
            max-width: 100%;
            overflow: auto;
            min-height: 200px;
            min-width: 320px;
        }
        #screen_container > div {
            white-space: pre;
            font: 14px monospace;
            line-height: 14px;
            color: #0f0;
        }
        #screen_container canvas {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
            display: block;
        }
        #status {
            margin-top: 10px;
            padding: 8px 16px;
            background: #252526;
            border-radius: 4px;
            font-size: 13px;
            color: #808080;
            max-width: 100%;
            word-wrap: break-word;
            text-align: center;
        }
        #status.error { color: #f48771; background: #3a1d1d; }
        #status.ok    { color: #4ec9b0; }
        #status.warn  { color: #dcdcaa; background: #3a3520; }
        #controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover  { background: #1177bb; }
        button:active { background: #094771; }
        button:disabled { background: #444; cursor: not-allowed; }
        #debug {
            margin-top: 10px;
            padding: 8px 16px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 11px;
            color: #888;
            font-family: monospace;
            max-width: 100%;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>🐧 KolibriOS Virtual Machine</h2>

    <!-- KHUNG HIỂN THỊ: CẤU TRÚC NÀY PHẢI GIỮ NGUYÊN -->
    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>
    </div>

    <div id="status">⏳ Đang khởi tạo...</div>

    <div id="controls">
        <button id="btnReload" disabled>🔄 Khởi động lại máy ảo</button>
    </div>

    <div id="debug"></div>

    <script src="libv86.js"></script>
    <script>
    (function () {
        "use strict";

        const statusEl  = document.getElementById("status");
        const debugEl   = document.getElementById("debug");
        const btnReload = document.getElementById("btnReload");

        function setStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = type || "";
        }

        function updateDebug() {
            const iso = window.crossOriginIsolated ? "✅ CÓ" : "❌ KHÔNG";
            const sab = (typeof SharedArrayBuffer !== "undefined") ? "✅ CÓ" : "❌ KHÔNG";
            const sw  = navigator.serviceWorker ? "✅ CÓ" : "❌ KHÔNG";
            debugEl.textContent =
                "Cross-Origin Isolated: " + iso + "\n" +
                "SharedArrayBuffer:    " + sab + "\n" +
                "Service Worker:       " + sw;
        }
        updateDebug();
        document.addEventListener("crossoriginisolated", updateDebug);

        window.addEventListener("error", function (e) {
            setStatus("❌ Lỗi: " + (e.message || e), "error");
        });

        if (typeof SharedArrayBuffer === "undefined") {
            setStatus("⚠️ Thiếu SharedArrayBuffer — máy ảo có thể chậm hoặc tự reload. Kiểm tra coi-serviceworker.js.", "warn");
        }

        // Tự nhận diện tên class (V86 bản mới, V86Starter bản cũ)
        const VMClass =
            (typeof V86        !== "undefined") ? V86        :
            (typeof V86Starter !== "undefined") ? V86Starter : null;

        let emulator = null;
        let bootTimeout = null;
        let booted = false;

        function clearBootTimeout() {
            if (bootTimeout) {
                clearTimeout(bootTimeout);
                bootTimeout = null;
            }
        }

        function destroyVM() {
            clearBootTimeout();
            if (emulator && typeof emulator.destroy === "function") {
                try { emulator.destroy(); } catch (e) { console.warn(e); }
            }
            emulator = null;
            booted = false;
            const canvas = document.querySelector("#screen_container canvas");
            const text   = document.querySelector("#screen_container > div");
            if (canvas) canvas.style.display = "none";
            if (text)   text.textContent = "";
        }

        function startVM() {
            if (!VMClass) {
                setStatus("❌ Không tìm thấy thư viện v86. Kiểm tra file libv86.js đã upload chưa.", "error");
                return;
            }

            destroyVM();
            btnReload.disabled = true;
            setStatus("⏳ Đang khởi tạo máy ảo...");

            try {
                emulator = new VMClass({
                    wasm_path: "v86.wasm",

                    // KolibriOS là hệ điều hành đồ họa → cần nhiều RAM
                    memory_size:     128 * 1024 * 1024,  // 128 MB
                    vga_memory_size:   8 * 1024 * 1024,  //   8 MB

                    screen_container: document.getElementById("screen_container"),

                    bios:     { url: "seabios.bin"  },
                    vga_bios: { url: "vgabios.bin"  },

                    // Cấu hình tối ưu: tải theo phần để tránh nghẽn buffer
                    fda: {
                        url: "kolibri.img",
                        async: true,
                        use_parts: true,
                        fixed_chunk_size: 1024 * 1024, // 1MB / phần
                    },

                    autostart: true,
                });

                emulator.add_listener("download-progress", function (e) {
                    if (e.file_name && e.file_size) {
                        const pct = Math.round((e.loaded / e.file_size) * 100);
                        setStatus("⏳ Đang tải " + e.file_name + ": " + pct + "%");
                    }
                });

                emulator.add_listener("download-error", function (e) {
                    setStatus("❌ Không tải được: " + (e.file_name || "unknown"), "error");
                });

                emulator.add_listener("emulator-ready", function () {
                    booted = true;
                    clearBootTimeout();
                    btnReload.disabled = false;
                    setStatus("✅ Máy ảo đã sẵn sàng. KolibriOS có thể mất 30–60 giây để hiện desktop — hãy kiên nhẫn.", "ok");
                });

                // Timeout cảnh báo sau 90 giây
                bootTimeout = setTimeout(function () {
                    if (!booted) {
                        setStatus("⚠️ Sau 90 giây vẫn chưa có tín hiệu khởi động. Có thể do thiếu RAM, image lỗi, hoặc thiếu SharedArrayBuffer. Nhấn 'Khởi động lại' để thử lại.", "warn");
                        btnReload.disabled = false;
                    }
                }, 90000);

            } catch (err) {
                setStatus("❌ Không khởi tạo được: " + err.message, "error");
                console.error(err);
                btnReload.disabled = false;
            }
        }

        btnReload.addEventListener("click", function () {
            startVM();
        });

        // Khởi động lần đầu
        startVM();
    })();
    </script>
</body>
</html>
